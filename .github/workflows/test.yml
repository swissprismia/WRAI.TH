name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wraith
          POSTGRES_PASSWORD: wraith
          POSTGRES_DB: observatory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GCC (CGO required for SQLite)
        run: sudo apt-get install -y -qq gcc

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/chat/package-lock.json

      - name: Build chat UI
        run: make ui

      - name: Run tests
        env:
          CGO_ENABLED: "1"
          WRAITH_OBSERVATORY_TEST_DB_URL: "postgres://wraith:wraith@localhost:5432/observatory_test"
        run: go test -race -count=1 ./...
